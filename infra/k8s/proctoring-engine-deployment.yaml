apiVersion: v1
kind: Namespace
metadata:
  name: proctorguard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proctoring-engine-deployment
  namespace: proctorguard
  labels:
    app: proctoring-engine
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proctoring-engine
  template:
    metadata:
      labels:
        app: proctoring-engine
    spec:
      containers:
        - name: proctoring-engine
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: websocket-http
          env:
            - name: REDIS_HOST
              value: "redis-cluster-service"
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BROKERS
              value: "kafka-service:9092"
            - name: MAX_CONCURRENT_SESSIONS
              value: "2000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: proctoring-engine-service
  namespace: proctorguard
spec:
  type: ClusterIP
  selector:
    app: proctoring-engine
  ports:
    - port: 8081
      targetPort: 8081
      name: http-ws
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proctoring-engine-hpa
  namespace: proctorguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proctoring-engine-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
