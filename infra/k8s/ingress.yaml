apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proctorguard-ingress
  namespace: proctorguard
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "proctoring-engine-service"
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - proctor.examplatform.com
        - api.proctor.examplatform.com
      secretName: proctorguard-tls-cert
  rules:
    - host: api.proctor.examplatform.com
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-biometrics-service
                port:
                  number: 8080
          - path: /api/v1/fusion
            pathType: Prefix
            backend:
              service:
                name: proctoring-engine-service
                port:
                  number: 8081
          - path: /api/v1/nlp
            pathType: Prefix
            backend:
              service:
                name: nlp-similarity-service
                port:
                  number: 8082
          - path: /api/v1/evidence
            pathType: Prefix
            backend:
              service:
                name: audit-evidence-service
                port:
                  number: 8083
