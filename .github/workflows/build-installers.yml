name: Build ProctorGuard Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Tauri Desktop App Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/desktop-client'
          tagName: v2.4.0
          releaseName: 'ProctorGuard v2.4.0'
          releaseBody: 'Automated release build of ProctorGuard Desktop Client Installers (.msi, .exe, .dmg, .AppImage)'
          releaseDraft: false
          prerelease: false

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proctorguard-${{ matrix.platform }}
          path: |
            apps/desktop-client/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop-client/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop-client/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop-client/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop-client/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
